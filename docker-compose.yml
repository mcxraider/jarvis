# Single-box topology: caddy (TLS) -> web (Node) -> agent (Python).
# The database is Supabase (external, managed) — no postgres container here.
# Both services read their Supabase pooler DSN from .env (see plans/dockerize.md §4).
# Only caddy publishes ports; web/agent stay on the internal network.

services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    env_file: .env
    environment:
      NODE_ENV: production
    # JARVIS_POSTGRES_DSN (Supabase transaction pooler) comes from .env and
    # switches the agent to the durable Postgres checkpoint backend automatically.
    restart: unless-stopped
    # No published ports — only `web` reaches it via the internal network.

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    env_file: .env
    environment:
      NODE_ENV: production
      LOG_FORMAT: json                    # structured logs to `docker logs`
      PORT: "3000"
      LANGGRAPH_AGENT_URL: http://agent:8000
    # TELEGRAM_PENDING_POSTGRES_DSN (Supabase pooler) comes from .env for durable
    # clarification routing across restarts.
    depends_on:
      - agent
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
