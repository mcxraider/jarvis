x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    env_file: .env
    environment:
      NODE_ENV: production
      JARVIS_POSTGRES_DSN: ${AGENT_POSTGRES_DSN:?AGENT_POSTGRES_DSN is required}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    volumes:
      - agent_logs:/app/logs
    logging: *bounded-logging
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    env_file: .env
    environment:
      NODE_ENV: production
      LOG_FORMAT: json
      PORT: "3000"
      LANGGRAPH_AGENT_URL: http://agent:8000
      JARVIS_POSTGRES_DSN: ${WEB_POSTGRES_DSN:?WEB_POSTGRES_DSN is required}
    depends_on:
      agent:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/ping').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    volumes:
      - web_logs:/app/logs
    logging: *bounded-logging
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    logging: *bounded-logging
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  web_logs:
  agent_logs:
